<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firefly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p>Loading</p>
  </div>

  <!-- Bottom bar: audio controls -->
  <div id="audio-bar">
    <button id="btn-audio">Ignite</button>

    <div class="audio-ctrl">
      <label>Bass → Size <span id="val-bass-size">3.0</span></label>
      <input type="range" id="sl-bass-size" min="0" max="20" step="0.5" value="3.0">
    </div>

    <div class="audio-ctrl">
      <label>Treble → Scatter <span id="val-treble-vib">3.0</span></label>
      <input type="range" id="sl-treble-vib" min="0" max="10" step="0.1" value="3.0">
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="main.js"></script>

</body>
</html>
